# 角色连接配置
# 文件名即为角色标识，建议用角色名命名
# 
# 运行时新增此文件后，可在客户端内用以下命令加载（无需重启）：
#   /profile list              — 列出可用角色
#   /profile load <角色名>     — 加载并连接

# 连接信息
name = "角色名"
host = "ln.xkxmud.com"
port = 5555
encoding = "gbk"

# Lua 脚本路径（相对于程序运行目录）
script = "scripts/example.lua"

# 连接行为
auto_connect = true
auto_reconnect = true
reconnect_delay_secs = 5

# 登录凭证（启动时自动注入 Lua 变量 char_name / char_password）
# 留空则不注入，需手动输入或通过 Lua 脚本 setname/setpwd 设置
username = "your_character_name"
password = "your_password"

# SOCKS5 代理（可选，不设置则直连）
socks5_enable = false
socks5_host = "127.0.0.1"
socks5_port = 1080
socks5_username = ""
socks5_password = ""

# 实时渲染开关（可选，默认 false，true 时忽略 render_interval 直接实时渲染）
realtime = true
# 渲染间隔（毫秒，0=实时渲染，默认 1000=1秒刷新一次）
render_interval = 1000

# 日志文件保留数量（可选，默认 24，即保留最近 24 个小时的日志文件）
log_rotation_count = 24

# 命令发送速率限制（令牌桶限速，可选）
# 限速由 Rust 侧令牌桶统一保证，Lua 脚本只负责入队
#
# cmd_interval_ms: 最小发送间隔（毫秒，默认 50，范围 20~200）
#   作为令牌桶的下限保护，仅在令牌不足时生效；令牌充足时允许突发
#   推荐值：50（普通玩家）、80（轻度延迟）、120（保守安全）
cmd_interval_ms = 50
#
# burst_size: 令牌桶容量（突发上限，默认 10）
#   允许短时间内发送的最大命令数，初始满桶
#   设为 1 可禁用突发，退化为固定间隔模式（最保守）
burst_size = 10
#
# cmds_per_sec: 每秒令牌补充速率（默认 20）
#   控制长期平均发送速率，令牌按此速率持续补充
cmds_per_sec = 20
