[package]
name = "rust-lua-mud"
version = "1.0.1"
edition = "2021"

[[bin]]
name = "RustLuaMud"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
encoding_rs = "0.8"
unicode-width = "0.2"
mlua = { version = "0.12", features = ["luajit", "vendored", "serialize"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
tokio-socks = "0.5"
# 仅用于 TCP keepalive 跨平台配置（tokio 已依赖 socket2，这里直接复用同一版本）
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.test]
# opt-level=1 保留调试符号，测试二进制更小、链接更快
# 不影响断点调试和 RUST_BACKTRACE 定位
opt-level = 1