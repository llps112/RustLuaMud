# 角色连接配置
# 文件名即为角色标识，建议用角色名命名
# 
# 运行时新增此文件后，可在客户端内用以下命令加载（无需重启）：
#   /profile list              — 列出可用角色
#   /profile load <角色名>     — 加载并连接

# 连接信息
name = "角色名"
host = "ln.xkxmud.com"
port = 5555
encoding = "gbk"

# Lua 脚本路径（相对于程序运行目录）
script = "scripts/example.lua"

# 连接行为
auto_connect = true
auto_reconnect = true
reconnect_delay_secs = 5

# 登录凭证（启动时自动注入 Lua 变量 char_name / char_password）
# 留空则不注入，需手动输入或通过 Lua 脚本 setname/setpwd 设置
username = "your_character_name"
password = "your_password"

# SOCKS5 代理（可选，不设置则直连）
socks5_enable = false
socks5_host = "127.0.0.1"
socks5_port = 1080
socks5_username = ""
socks5_password = ""

# 实时渲染开关（可选，默认 false，true 时忽略 render_interval 直接实时渲染）
realtime = true
# 渲染间隔（毫秒，0=实时渲染，默认 1000=1秒刷新一次）
render_interval = 1000

# 日志文件保留数量（可选，默认 24，即保留最近 24 个小时的日志文件）
log_rotation_count = 24

# 命令发送速率限制（令牌桶限速，可选）
# 限速由 Rust 侧令牌桶统一保证，Lua 脚本只负责入队
#
# 服务端限速机制（LPC cmd.c）：
#   - cnt 计数器，每条命令 +1
#   - 每 2 秒 drain 40（clear_cmd_count: cnt -= 40）
#   - cnt > 60 → 雷劈/unconscious/踢出
#   - cnt > 20 → 小惩罚（扣气）
#   等效令牌桶：容量 60，每 2 秒补充 40
#
# 安全公式：burst_size + cmd_interval_ms间隔下2秒内命令数 ≤ 60
#   例：burst=15 + 50ms间隔(40条/2秒) = 55 ≤ 60，留5条余量
#
# cmd_interval_ms: 突发用完后的最小发送间隔（毫秒，默认 50）
#   50ms = 20条/秒 = 40条/2秒（drain周期内）
cmd_interval_ms = 50
#
# burst_size: 突发上限（默认 15，建议 ≤ 20）
#   连线/空闲后允许连续发送的命令数（0ms 间隔），用完后进入匀速模式
#   burst + 2秒内匀速命令数必须 ≤ 60，建议留余量
burst_size = 15
#
# cmds_per_sec: 每秒令牌补充速率（默认 20）
#   控制长期平均发送速率，应与服务端 drain 速率匹配（40/2秒=20/秒）
cmds_per_sec = 20
