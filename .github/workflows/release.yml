name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: i686
            target: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install 32-bit dependencies
        if: matrix.arch == 'i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/RustLuaMud release/
          tar czf release/RustLuaMud-linux-${{ matrix.arch }}.tar.gz -C release RustLuaMud

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-lua-mud-${{ matrix.arch }}
          path: release/RustLuaMud-linux-${{ matrix.arch }}.tar.gz

  build-windows:
    name: Build (x86_64-windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/RustLuaMud.exe release/RustLuaMud.exe -Force
          Compress-Archive -Path release/RustLuaMud.exe -DestinationPath release/RustLuaMud-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-lua-mud-windows-x86_64
          path: release/RustLuaMud-windows-x86_64.zip

  build-macos:
    name: Build (arm64-macos)
    # Apple Silicon（M1 及以上）原生 runner。macOS 产物无法在 Linux runner 上
    # 交叉编译：Darwin SDK 与链接器不可自由再分发，只能用 GitHub 的 macOS runner。
    # 不用 macos-14：该镜像已于 2026-11-02 退役（官方 changelog 2026-10-01），
    # 写它会直接找不到 runner。macos-15 同为 arm64，且其 SDK 支持把部署目标
    # 钉到 11.0；macos-latest 当前映射 macos-26，SDK 太新反而可能抬高部署下限。
    runs-on: macos-15
    env:
      # 不指定时 ld 按构建机 OS 版本写 LC_BUILD_VERSION 的 minos，产物会强要求
      # 不低于构建机的 macOS 版本；11.0 是 arm64 的原生下限，可覆盖全部 M 系列机器。
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Smoke test binary
        # --version 分支不碰终端就 exit，能在无 TTY 的 CI 环下跑；真跑不起来
        # （缺 dylib 符号、minos 写错、错架构）都会在这一步暴露，而不是到用户手里。
        # 本步失败会让 build-macos 变红，由 needs 挡住 release，不会发残包。
        run: |
          BIN=target/aarch64-apple-darwin/release/RustLuaMud
          file "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          "./$BIN" --version

      - name: Package binary
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/RustLuaMud release/
          tar czf release/RustLuaMud-macos-arm64.tar.gz -C release RustLuaMud

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-lua-mud-macos-arm64
          path: release/RustLuaMud-macos-arm64.tar.gz

  release:
    name: Create Release
    needs: [build, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      # 必须全量拉取历史与 tag：默认浅克隆(depth=1)下 `git describe --tags HEAD^`
      # 取不到上一个 tag、`${PREV_TAG}..HEAD` 也无历史，Release 正文只会剩 HEAD 一条
      # subject（v0.9.x 及之前所有版本的 changelog 只有一行就是这个原因）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # 获取上一个 tag 到当前 tag 的提交记录
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" --reverse)
          else
            LOG=$(git log --pretty=format:"- %s" --reverse ${PREV_TAG}..HEAD)
          fi
          # 纯元数据提交不该占 changelog 行：
          #   - `chore: 更新子模块指针` 是 git-workflow.md 规定的固定文案，一个发布区间里
          #     常出好几条完全相同的行（v0.9.4 有 4 条、v0.9.5 有 5 条），对外零信息量；
          #   - `chore: bump version to ...` 是自我指涉（本次发布存在的原因本身就是它）。
          # grep -v 无匹配时返回 1，bash -e 下会直接中断 run，必须接 || true。
          # 若过滤后为空（该区间只有元数据提交），退回未过滤版本，避免空 changelog。
          FILTERED=$(printf '%s\n' "$LOG" | grep -v -e '^- chore: 更新子模块指针$' -e '^- chore: bump version to ' || true)
          if [ -n "$FILTERED" ]; then
            LOG="$FILTERED"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
          files: |
            release/RustLuaMud-linux-x86_64.tar.gz
            release/RustLuaMud-linux-i686.tar.gz
            release/RustLuaMud-windows-x86_64.zip
            release/RustLuaMud-macos-arm64.tar.gz

      - name: Sync to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_CI }}
        run: |
          set -e
          OWNER="bai-yifei180"
          REPO="RustLuaMud"
          TAG="${{ steps.changelog.outputs.tag }}"
          AUTH="access_token=${GITEE_TOKEN}"
          BASE="https://gitee.com/api/v5/repos/${OWNER}/${REPO}"

          # Gitee 海外链路偶发 TLS 被重置 (curl exit 35)，不在 curl 默认瞬态错误列表，
          # 必须 --retry-all-errors 才会重试；Gitee 同步很慢，超时必须给宽裕：
          # 只限 connect-timeout（建连阶段），不设 --max-time（不限制传输总时长）；
          # 上传调用可在 "$@" 处追加 --retry-delay 60 覆盖重试间隔
          gitee_curl() { curl -sS --connect-timeout 60 --retry 6 --retry-delay 30 --retry-all-errors "$@"; }

          # 获取或创建 Release
          echo "==> Checking existing release on Gitee..."
          RESP=$(gitee_curl "${BASE}/releases/tags/${TAG}?${AUTH}" || echo "")
          RELEASE_ID=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('id', ''))
          except:
              print('')
          " 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            echo "==> Creating Gitee Release (tag: ${TAG})..."
            CHANGELOG="${{ steps.changelog.outputs.changelog }}"
            PAYLOAD=$(python3 -c "
          import json
          payload = {
              'tag_name': '${TAG}',
              'target_commitish': 'main',
              'name': 'Release ${TAG}',
              'body': '''## Changes
          ${CHANGELOG}''',
              'prerelease': False,
          }
          print(json.dumps(payload))
          ")
            RESP=$(gitee_curl -X POST -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${BASE}/releases?${AUTH}" || echo "")
            echo "   API response: $(echo "$RESP" | head -c 300)"
            RELEASE_ID=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('id', ''))
          except:
              print('')
          " 2>/dev/null || echo "")
            echo "   Created release ID: ${RELEASE_ID}"
          else
            echo "==> Found existing Gitee Release (ID: ${RELEASE_ID})"
          fi

          if [ -n "$RELEASE_ID" ]; then
            echo "==> Uploading artifacts to Gitee Release..."
            for FILE in release/*.tar.gz release/*.zip; do
              echo "   Uploading: $FILE"
              UPLOAD_RESP=$(gitee_curl --retry-delay 60 -X POST \
                -F "file=@${FILE}" \
                "${BASE}/releases/${RELEASE_ID}/attach_files?${AUTH}")
              echo "   Upload response: $(echo "$UPLOAD_RESP" | head -c 300)"
            done
            echo "==> Gitee Release sync complete."
          else
            echo "!! Failed to get or create Gitee Release"
            exit 1
          fi
