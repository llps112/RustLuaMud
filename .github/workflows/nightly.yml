name: Nightly Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nightly.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: i686
            target: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install 32-bit dependencies
        if: matrix.arch == 'i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/RustLuaMud release/
          tar czf release/RustLuaMud-linux-${{ matrix.arch }}.tar.gz -C release RustLuaMud

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-lua-mud-nightly-${{ matrix.arch }}
          path: release/RustLuaMud-linux-${{ matrix.arch }}.tar.gz

  build-windows:
    name: Build (x86_64-windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/RustLuaMud.exe release/RustLuaMud.exe -Force
          Compress-Archive -Path release/RustLuaMud.exe -DestinationPath release/RustLuaMud-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-lua-mud-nightly-windows-x86_64
          path: release/RustLuaMud-windows-x86_64.zip

  build-macos:
    name: Build (arm64-macos)
    # 与 release.yml 同理：只能用 GitHub 的 macOS 原生 runner，且必须钉死
    # MACOSX_DEPLOYMENT_TARGET，否则产物只在新于构建机的 macOS 上能跑。
    # macos-14 已于 2026-11-02 退役，不可再用；macos-15 同为 arm64。
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Smoke test binary
        # 同 release.yml：--version 不碰终端即可退出，验证产物能加载。
        # 失败会让 build-macos 变红，由 needs 挡住 nightly 发布。
        run: |
          BIN=target/aarch64-apple-darwin/release/RustLuaMud
          file "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          "./$BIN" --version

      - name: Package binary
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/RustLuaMud release/
          tar czf release/RustLuaMud-macos-arm64.tar.gz -C release RustLuaMud

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-lua-mud-nightly-macos-arm64
          path: release/RustLuaMud-macos-arm64.tar.gz

  release:
    name: Upload to Nightly Release
    needs: [build, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Upload to Nightly Release (GitHub)
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly Build
          body: "自动构建于 main 分支最新提交。\n\n```\n# x86_64\ncurl -L https://github.com/llps112/RustLuaMud/releases/download/nightly/RustLuaMud-linux-x86_64.tar.gz | tar xz\n\n# i686 (32-bit)\ncurl -L https://github.com/llps112/RustLuaMud/releases/download/nightly/RustLuaMud-linux-i686.tar.gz | tar xz\n\n# windows x64 (PowerShell)\niwr https://github.com/llps112/RustLuaMud/releases/download/nightly/RustLuaMud-windows-x86_64.zip -OutFile RustLuaMud-windows.zip\nExpand-Archive RustLuaMud-windows.zip -DestinationPath .\n\n# macOS Apple Silicon (M1/M2/...)\ncurl -L https://github.com/llps112/RustLuaMud/releases/download/nightly/RustLuaMud-macos-arm64.tar.gz | tar xz\nxattr -d com.apple.quarantine ./RustLuaMud   # 未签名产物，清掉隔离标记才能运行\n```"
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            release/*.tar.gz
            release/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_CI }}
        run: |
          set -e
          OWNER="bai-yifei180"
          REPO="RustLuaMud"
          TAG="nightly"
          AUTH="access_token=${GITEE_TOKEN}"
          BASE="https://gitee.com/api/v5/repos/${OWNER}/${REPO}"

          # Gitee 海外链路偶发 TLS 被重置 (curl exit 35)，不在 curl 默认瞬态错误列表，
          # 必须 --retry-all-errors 才会重试；Gitee 同步很慢，超时必须给宽裕：
          # 只限 connect-timeout（建连阶段），不设 --max-time（不限制传输总时长）；
          # 上传调用可在 "$@" 处追加 --retry-delay 60 覆盖重试间隔
          gitee_curl() { curl -sS --connect-timeout 60 --retry 6 --retry-delay 30 --retry-all-errors "$@"; }

          # 获取或创建 Release
          echo "==> Checking existing release..."
          RESP=$(gitee_curl "${BASE}/releases/tags/${TAG}?${AUTH}" || echo "")
          RELEASE_ID=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('id', ''))
          except:
              print('')
          " 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            echo "==> No existing Gitee Release found for tag ${TAG}."
          else
            echo "==> Deleting existing Gitee Release (ID: ${RELEASE_ID})..."
            DELETE_RESP=$(gitee_curl -X DELETE \
              "${BASE}/releases/${RELEASE_ID}?${AUTH}" || echo "")
            echo "   Delete response: $(echo "$DELETE_RESP" | head -c 200)"
            # 删除后 tag 也会被删除，后续创建会重新创建 tag
          fi

          echo "==> Creating Gitee Release (tag: ${TAG})..."
          PAYLOAD=$(python3 -c "
          import json
          payload = {
              'tag_name': '${TAG}',
              'target_commitish': 'main',
              'name': 'Nightly Build',
              'body': '自动构建于 main 分支最新提交。\n\n下载地址：\n\`\`\`\n# x86_64\ncurl -L https://gitee.com/${OWNER}/${REPO}/releases/download/${TAG}/RustLuaMud-linux-x86_64.tar.gz | tar xz\n\n# i686 (32-bit)\ncurl -L https://gitee.com/${OWNER}/${REPO}/releases/download/${TAG}/RustLuaMud-linux-i686.tar.gz | tar xz\n\n# windows x64 (PowerShell)\niwr https://gitee.com/${OWNER}/${REPO}/releases/download/${TAG}/RustLuaMud-windows-x86_64.zip -OutFile RustLuaMud-windows.zip\nExpand-Archive RustLuaMud-windows.zip -DestinationPath .\n\n# macOS Apple Silicon (M1/M2/...)\ncurl -L https://gitee.com/${OWNER}/${REPO}/releases/download/${TAG}/RustLuaMud-macos-arm64.tar.gz | tar xz\nxattr -d com.apple.quarantine ./RustLuaMud   # 未签名产物，清掉隔离标记才能运行\n\`\`\`',
              'prerelease': True,
          }
          print(json.dumps(payload))
          ")
          RESP=$(gitee_curl -X POST -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${BASE}/releases?${AUTH}" || echo "")
          echo "   API response: $(echo "$RESP" | head -c 300)"
          RELEASE_ID=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('id', ''))
          except:
              print('')
          " 2>/dev/null || echo "")
          echo "   Created release ID: ${RELEASE_ID}"

          if [ -n "$RELEASE_ID" ]; then
            echo "==> Uploading artifacts to Gitee Release..."
            for FILE in release/*.tar.gz release/*.zip; do
              echo "   Uploading: $FILE ($(du -h "$FILE" | cut -f1))"
              UPLOAD_RESP=$(gitee_curl --retry-delay 60 -X POST \
                -F "file=@${FILE}" \
                "${BASE}/releases/${RELEASE_ID}/attach_files?${AUTH}" 2>&1 || echo "UPLOAD_FAILED")
              echo "   Upload response: $(echo "$UPLOAD_RESP" | head -c 300)"
              if [ "$UPLOAD_RESP" = "UPLOAD_FAILED" ]; then
                echo "!! Upload failed, skipping Gitee sync"
              fi
            done
            echo "==> Gitee Release sync complete."
          else
            echo "!! Failed to get or create Gitee Release"
            exit 1
          fi
